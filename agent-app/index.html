<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OjaTrack Agent</title><script src="https://cdn.tailwindcss.com"></script></head>
<body style="background:#f0fdf4;font-family:sans-serif;padding:16px">
<div style="max-width:420px;margin:auto;background:white;border-radius:24px;padding:20px">
<h2 style="font-weight:800">Agent Portal - Sell & Earn</h2>
<p style="color:#666;font-size:12px;margin-top:4px">Earn ₦500 per shop you onboard</p>

<div style="margin-top:16px;background:#dcfce7;border-radius:12px;padding:12px;display:flex;justify-content:space-between">
<span>Today Earned</span><b style="color:#00a63e">₦2,500</b>
</div>

<input placeholder="Shop Owner Phone" style="margin-top:16px;width:100%;border:1px solid #ddd;padding:12px;border-radius:12px">
<input placeholder="Shop Name" style="margin-top:10px;width:100%;border:1px solid #ddd;padding:12px;border-radius:12px">
<button onclick="alert('Shop created! Commission added!')" style="margin-top:16px;width:100%;background:#00c950;color:white;padding:14px;border-radius:12px;font-weight:bold">Onboard Shop</button>

<p style="text-align:center;margin-top:16px;font-size:11px;color:#999">Built for Africa, Starting Nigeria</p>
</div>
</body></html>
